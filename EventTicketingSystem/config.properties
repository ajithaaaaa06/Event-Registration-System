# ---------------------------------------------------------------
#  Event Ticketing System - database settings
# ---------------------------------------------------------------
# db.mode:
#   auto  -> use MySQL if it is reachable, otherwise open in offline mode (local file)  [default]
#   mysql -> MySQL only (shows an error if it cannot connect)
#   local -> never use MySQL (data is kept in data/events.dat)
db.mode=auto

# The database "event_ticketing" and its tables are created automatically on first run.
db.url=jdbc:mysql://localhost:3306/event_ticketing?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
db.user=root
db.password=
